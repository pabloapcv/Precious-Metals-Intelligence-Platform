[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "precious-metals-platform"
version = "0.1.0"
description = "Precious Metals Macro Intelligence Platform — institutional-grade gold & mining analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "scipy>=1.14.1",
    "scikit-learn>=1.5.2",
    "lightgbm>=4.5.0",
    "xgboost>=2.1.3",
    "catboost>=1.2.7",
    "hmmlearn>=0.3.3",
    "ruptures>=1.1.9",
    "yfinance>=0.2.48",
    "fredapi>=0.5.2",
    "requests>=2.32.3",
    "httpx>=0.28.0",
    "prefect>=3.1.0",
    "mlflow>=2.18.0",
    "shap>=0.46.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "ta>=0.11.0",
    "networkx>=3.4.2",
    "openai>=1.57.0",
    "anthropic>=0.40.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "pyarrow>=18.1.0",
    "joblib>=1.4.2",
    "cvxpy>=1.6.0",
    "riskfolio-lib>=6.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
