<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-label="Two decisions: gold budget then gold sleeve">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#1a2234"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="920" height="340" rx="16" fill="url(#bg)"/>
  <text x="36" y="42" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Two decisions the desk never collapses</text>
  <text x="36" y="66" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">Budget first | sleeve second | residual to SPX</text>
  <rect x="36" y="110" width="150" height="64" rx="10" fill="#222d42" stroke="#3d4f6a"/>
  <text x="111" y="138" text-anchor="middle" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Morning book</text>
  <text x="111" y="158" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="11">macro + prices</text>
  <line x1="186" y1="142" x2="230" y2="142" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="230" y="94" width="210" height="96" rx="12" fill="#2a2418" stroke="#d4a843" stroke-width="2"/>
  <text x="335" y="122" text-anchor="middle" fill="#d4a843" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">DECISION A</text>
  <text x="335" y="146" text-anchor="middle" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Gold budget</text>
  <text x="335" y="168" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="11">Add 60% | Keep 30% | Reduce 10%</text>
  <line x1="440" y1="142" x2="486" y2="142" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="486" y="94" width="210" height="96" rx="12" fill="#14241f" stroke="#34d399" stroke-width="2"/>
  <text x="591" y="122" text-anchor="middle" fill="#34d399" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">DECISION B</text>
  <text x="591" y="146" text-anchor="middle" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Gold sleeve</text>
  <text x="591" y="168" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="11">&lt;=8 long / OW names | else GLD</text>
  <line x1="696" y1="142" x2="742" y2="142" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="742" y="110" width="142" height="64" rx="10" fill="#222d42" stroke="#60a5fa"/>
  <text x="813" y="138" text-anchor="middle" fill="#60a5fa" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Residual</text>
  <text x="813" y="158" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="11">to SPX</text>
  <text x="36" y="240" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600">WHERE YOU SEE IT</text>
  <rect x="36" y="256" width="200" height="48" rx="8" fill="#111827" stroke="#2a3548"/>
  <text x="136" y="285" text-anchor="middle" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="12">Gold vs Markets (ALC)</text>
  <rect x="260" y="256" width="200" height="48" rx="8" fill="#111827" stroke="#2a3548"/>
  <text x="360" y="285" text-anchor="middle" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="12">Signal Book (SIG)</text>
  <rect x="484" y="256" width="200" height="48" rx="8" fill="#111827" stroke="#2a3548"/>
  <text x="584" y="285" text-anchor="middle" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="12">Strategy Desk (STR)</text>
  <rect x="708" y="256" width="176" height="48" rx="8" fill="#111827" stroke="#2a3548"/>
  <text x="796" y="285" text-anchor="middle" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="12">Paper Books (PAP)</text>
</svg>
