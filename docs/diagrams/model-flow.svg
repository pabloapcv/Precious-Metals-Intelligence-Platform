<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-label="Supervised model flow from features to signal labels">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#1a2234"/>
    </linearGradient>
    <marker id="arr6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="920" height="360" rx="16" fill="url(#bg6)"/>
  <text x="36" y="40" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Supervised model flow (entity x horizon)</text>
  <text x="36" y="62" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">Horizons: 5 | 10 | 20 | 63 | 126 trading days | LightGBM preferred, else sklearn HGB</text>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="36" y="100" width="160" height="80" rx="10" fill="#1a2234" stroke="#3d4f6a"/>
    <text x="116" y="134" text-anchor="middle" fill="#f0f4f8" font-size="13" font-weight="700">Features</text>
    <text x="116" y="156" text-anchor="middle" fill="#94a3b8" font-size="11">returns | vol | ratios</text>
    <text x="116" y="172" text-anchor="middle" fill="#94a3b8" font-size="11">yields | DXY | VIX</text>
    <line x1="196" y1="140" x2="236" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr6)"/>
    <rect x="236" y="90" width="180" height="100" rx="10" fill="#2a2418" stroke="#d4a843" stroke-width="2"/>
    <text x="326" y="120" text-anchor="middle" fill="#d4a843" font-size="12" font-weight="700">Two heads</text>
    <text x="326" y="144" text-anchor="middle" fill="#f0f4f8" font-size="12">Classifier: beat GC=F?</text>
    <text x="326" y="166" text-anchor="middle" fill="#f0f4f8" font-size="12">Regressor: fwd return</text>
    <line x1="416" y1="140" x2="456" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr6)"/>
    <rect x="456" y="90" width="200" height="100" rx="10" fill="#1a2234" stroke="#34d399"/>
    <text x="556" y="120" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">Stored outputs</text>
    <text x="556" y="144" text-anchor="middle" fill="#f0f4f8" font-size="12">P(Gold) | E[return]</text>
    <text x="556" y="166" text-anchor="middle" fill="#94a3b8" font-size="11">alpha = E[r] - 1% | P(GDX)* = 0.95P</text>
    <line x1="656" y1="140" x2="696" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr6)"/>
    <rect x="696" y="90" width="188" height="100" rx="10" fill="#1a2234" stroke="#a78bfa"/>
    <text x="790" y="120" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">Signal label</text>
    <text x="790" y="144" text-anchor="middle" fill="#f0f4f8" font-size="12">long / OW / neu</text>
    <text x="790" y="166" text-anchor="middle" fill="#f0f4f8" font-size="12">UW / short</text>
  </g>
  <rect x="36" y="230" width="848" height="100" rx="12" fill="#111827" stroke="#2a3548"/>
  <text x="56" y="262" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Deterministic cutoffs (not a third model)</text>
  <text x="56" y="288" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">Long: P &gt;= 60% and alpha &gt; 0 | Overweight: P &gt;= 55% | Neutral: 45-55% | Underweight: P &lt;= 45%</text>
  <text x="56" y="310" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">Short: P &lt;= 40% and alpha &lt; 0 | Sleeve = equal-weight up to 8 long/OW | fallback GLD</text>
</svg>
