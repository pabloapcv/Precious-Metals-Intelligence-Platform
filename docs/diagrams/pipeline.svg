    <text x="656" y="176" text-anchor="middle" fill="#64748b" font-size="9">weight 6</text>
    <line x1="704" y1="144" x2="722" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr5)"/>
    <rect x="722" y="100" width="80" height="88" rx="10" fill="#1a2234" stroke="#3d4f6a"/>
    <text x="762" y="138" text-anchor="middle" fill="#f0f4f8" font-size="11" font-weight="700">Port.</text>
    <text x="762" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">HRP</text>
    <text x="762" y="176" text-anchor="middle" fill="#64748b" font-size="9">wt 2</text>
    <line x1="802" y1="144" x2="820" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr5)"/>
    <rect x="820" y="100" width="80" height="88" rx="10" fill="#142033" stroke="#60a5fa"/>
    <text x="860" y="138" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">Paper</text>
    <text x="860" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">books</text>
    <text x="860" y="176" text-anchor="middle" fill="#64748b" font-size="9">wt 2</text>
