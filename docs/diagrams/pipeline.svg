    <text x="72" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">prices</text>
    <text x="72" y="176" text-anchor="middle" fill="#64748b" font-size="9">weight 10</text>
    <line x1="120" y1="144" x2="138" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr5)"/>
    <rect x="138" y="100" width="96" height="88" rx="10" fill="#1a2234" stroke="#3d4f6a"/>
    <text x="186" y="138" text-anchor="middle" fill="#f0f4f8" font-size="11" font-weight="700">Features</text>
    <text x="186" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">matrix</text>
    <text x="186" y="176" text-anchor="middle" fill="#64748b" font-size="9">weight 12</text>
    <line x1="234" y1="144" x2="252" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr5)"/>
    <rect x="252" y="100" width="96" height="88" rx="10" fill="#1a2234" stroke="#3d4f6a"/>
    <text x="300" y="138" text-anchor="middle" fill="#f0f4f8" font-size="11" font-weight="700">Regime</text>
    <text x="300" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">HMM-4</text>
    <text x="300" y="176" text-anchor="middle" fill="#64748b" font-size="9">weight 4</text>
    <line x1="348" y1="144" x2="366" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr5)"/>
    <rect x="366" y="100" width="110" height="88" rx="10" fill="#2a2418" stroke="#d4a843" stroke-width="2"/>
    <text x="421" y="138" text-anchor="middle" fill="#d4a843" font-size="11" font-weight="700">Train</text>
