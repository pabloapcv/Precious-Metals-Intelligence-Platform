  <rect x="24" y="220" width="876" height="56" rx="10" fill="#111827" stroke="#2a3548"/>
  <text x="44" y="244" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Presets:</text>
  <text x="110" y="244" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="11">Refresh = ETL-Features-Regime | Rescore = Predict-Portfolio | Rebuild paper = History-Paper</text>
  <text x="44" y="264" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="11">Train short = Train-Predict-Portfolio on 5d/10d/1m liquid sleeve | Full = all stages + walk-forward</text>
