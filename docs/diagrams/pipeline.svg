    <text x="421" y="176" text-anchor="middle" fill="#64748b" font-size="9">weight 58</text>
    <line x1="476" y1="144" x2="494" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr5)"/>
    <rect x="494" y="100" width="96" height="88" rx="10" fill="#1a2234" stroke="#3d4f6a"/>
    <text x="542" y="138" text-anchor="middle" fill="#f0f4f8" font-size="11" font-weight="700">Predict</text>
    <text x="542" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">live scores</text>
    <text x="542" y="176" text-anchor="middle" fill="#64748b" font-size="9">weight 6</text>
    <line x1="590" y1="144" x2="608" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr5)"/>
    <rect x="608" y="100" width="96" height="88" rx="10" fill="#142033" stroke="#60a5fa"/>
    <text x="656" y="138" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">History</text>
