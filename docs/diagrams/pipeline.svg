<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-label="Pipeline stages from ETL to paper books">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#1a2234"/>
    </linearGradient>
    <marker id="arr5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="920" height="300" rx="16" fill="url(#bg5)"/>
  <text x="36" y="38" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Pipeline stages</text>
  <text x="36" y="58" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">Presets skip stages | full run can take 1-3+ hours</text>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="24" y="100" width="96" height="88" rx="10" fill="#1a2234" stroke="#d4a843"/>
