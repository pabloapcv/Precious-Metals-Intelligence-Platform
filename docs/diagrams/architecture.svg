  <text x="680" y="298" text-anchor="middle" fill="#60a5fa" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">EVIDENCE PATH</text>
  <text x="680" y="322" text-anchor="middle" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="12">As-of HGB refits | embargo = horizon</text>
  <text x="680" y="342" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="11">HST / PAP | purged WF (make research)</text>
  <text x="680" y="362" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="11">baselines | 10 bps flip cost</text>
  <line x1="240" y1="378" x2="240" y2="404" stroke="#94a3b8" stroke-width="2"/>
  <line x1="680" y1="378" x2="680" y2="404" stroke="#94a3b8" stroke-width="2"/>
