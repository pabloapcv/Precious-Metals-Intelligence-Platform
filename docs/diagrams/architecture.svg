<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="PMIP system architecture">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
  </defs>
  <rect width="920" height="520" rx="16" fill="url(#bg4)"/>
  <text x="36" y="40" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">System architecture</text>
  <text x="36" y="62" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">React terminal -&gt; FastAPI -&gt; dual scoring paths -&gt; warehouse -&gt; ETL</text>
  <rect x="200" y="90" width="520" height="56" rx="12" fill="#1a2234" stroke="#d4a843" stroke-width="2"/>
  <text x="460" y="124" text-anchor="middle" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">React research terminal | 12 workspaces</text>
