  <rect x="260" y="172" width="400" height="48" rx="10" fill="#222d42" stroke="#3d4f6a"/>
  <text x="460" y="202" text-anchor="middle" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600">FastAPI | dashboard | allocation | research | paper | pipeline</text>
  <line x1="460" y1="220" x2="460" y2="246" stroke="#94a3b8" stroke-width="2"/>
  <line x1="240" y1="246" x2="680" y2="246" stroke="#94a3b8" stroke-width="2"/>
