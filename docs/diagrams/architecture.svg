  <text x="240" y="322" text-anchor="middle" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="12">LightGBM / HistGradientBoosting</text>
  <text x="240" y="342" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="11">full-sample registry | SIG / STR / ALC / PTF</text>
