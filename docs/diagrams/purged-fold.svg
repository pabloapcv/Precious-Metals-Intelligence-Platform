<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-label="Purged walk-forward fold with horizon embargo">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#151c2b"/>
    </linearGradient>
  </defs>
  <rect width="920" height="320" rx="16" fill="url(#bg7)"/>
  <text x="36" y="40" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Purged walk-forward fold</text>
  <text x="36" y="62" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">Embargo = horizon | fold step = horizon | prevents label leakage into the test date</text>
  <rect x="60" y="130" width="800" height="36" rx="6" fill="#222d42"/>
  <rect x="60" y="130" width="420" height="36" rx="6" fill="#34d399" fill-opacity="0.85"/>
  <text x="270" y="154" text-anchor="middle" fill="#0a0e17" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">TRAIN (labels fully observed)</text>
  <rect x="480" y="130" width="140" height="36" fill="#f87171" fill-opacity="0.9"/>
  <text x="550" y="154" text-anchor="middle" fill="#0a0e17" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">EMBARGO</text>
  <rect x="620" y="130" width="100" height="36" fill="#60a5fa" fill-opacity="0.95"/>
  <text x="670" y="154" text-anchor="middle" fill="#0a0e17" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">TEST</text>
  <rect x="720" y="130" width="140" height="36" rx="6" fill="#2a3548"/>
  <text x="790" y="154" text-anchor="middle" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="11">future path</text>
  <text x="270" y="110" text-anchor="middle" fill="#34d399" font-family="Helvetica, Arial, sans-serif" font-size="11">~120 trading days (adaptive)</text>
  <text x="550" y="110" text-anchor="middle" fill="#f87171" font-family="Helvetica, Arial, sans-serif" font-size="11">= horizon (e.g. 10d)</text>
  <text x="670" y="110" text-anchor="middle" fill="#60a5fa" font-family="Helvetica, Arial, sans-serif" font-size="11">score date T</text>
  <rect x="60" y="200" width="800" height="90" rx="12" fill="#111827" stroke="#2a3548"/>
  <text x="80" y="232" fill="#f0f4f8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">What this blocks</text>
  <text x="80" y="256" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">Training rows whose forward label would peek into the test window are removed.</text>
  <text x="80" y="278" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="12">Used by make research and by as-of history/paper scoring - not by the live morning Signal Book.</text>
</svg>
